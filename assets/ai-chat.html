<!-- AI Chat Section Component -->
<section id="ai-chat" class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-10">
      <h2 class="font-display text-3xl sm:text-4xl font-bold text-paytm-navy mb-4">Your AI Business Partner</h2>
      <p class="text-slate-600 text-lg">Ask anything about your store. Get practical answers in seconds — in English or Hindi.</p>
    </div>

    <div class="max-w-3xl mx-auto">
      <div class="bg-slate-50 rounded-2xl border border-slate-200 shadow-card overflow-hidden">
        <!-- Chat header -->
        <div class="bg-gradient-to-r from-paytm-dark to-paytm-navy px-5 py-4 flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center">
            <img src="assets/images/logo-white.svg" alt="" class="w-5 h-5" />
          </div>
          <div>
            <p class="font-semibold text-white">Growth AI</p>
            <p class="text-xs text-paytm-blue/90 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
              Online · Demo mode
            </p>
          </div>
        </div>

        <!-- Messages -->
        <div id="chat-messages" class="h-80 overflow-y-auto p-4 space-y-4 scroll-smooth">
          <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-paytm-dark flex-shrink-0 flex items-center justify-center">
              <img src="assets/images/logo-white.svg" alt="" class="w-4 h-4" />
            </div>
            <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm border border-slate-100 max-w-[85%]">
              <p class="text-sm text-slate-700">Namaste! Main aapka AI business partner hoon. Aaj aapki sales ₹42,850 rahi. Kya main aapko growth tips doon, ya koi sawal poochna hai?</p>
            </div>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="px-4 pb-2 flex flex-wrap gap-2">
          <button class="quick-prompt px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:border-paytm-blue hover:text-paytm-dark transition" data-prompt="How can I increase sales this week?">Increase sales</button>
          <button class="quick-prompt px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:border-paytm-blue hover:text-paytm-dark transition" data-prompt="What should I restock?">Restock advice</button>
          <button class="quick-prompt px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:border-paytm-blue hover:text-paytm-dark transition" data-prompt="Suggest a festival offer">Festival offer</button>
          <button class="quick-prompt px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:border-paytm-blue hover:text-paytm-dark transition" data-prompt="Peak hours analysis">Peak hours</button>
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-slate-200 bg-white">
          <form id="chat-form" class="flex gap-2">
            <input type="text" id="chat-input" placeholder="Ask about sales, inventory, marketing..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-paytm-blue/40 focus:border-paytm-blue" autocomplete="off" />
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-paytm-dark text-white font-medium hover:bg-paytm-navy transition flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              Send
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
